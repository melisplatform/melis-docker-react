# Opt-in: Vite dev server for hacking on the React back-office source with HMR.
#
# NOT needed to USE /melis-react — the baked image ships a committed production
# build that nginx + PHP-FPM serve on their own. This override is only for
# developing the React UI (melis-core/ui-react, inside the melis-app named volume):
#
#   docker compose -f docker-compose.yml -f docker-compose.vite.yml up -d
#   # → http://localhost:5173   (HMR; proxies /melis, /assets, /Melis* to nginx)
#
# Note: with this stack the sources live in the melis-app named volume (not on the
# host). For day-to-day React development prefer the install/ stack, where the code
# is bind-mounted from ./melis and editable with your IDE.
services:
  vite:
    image: node:22-alpine
    container_name: ${MELIS_CONTAINER_NAME:-melis}-vite
    working_dir: /var/www/${APP_NAME:-melis}/vendor/melisplatform/melis-core/ui-react
    # Supervisor loop — NEVER exits, NEVER relies on a container restart.
    #
    # Composer REPLACES vendor/melisplatform/melis-core whenever it touches the
    # package: on first boot (enable-react.sh), during the web installer's own
    # `composer update`, and on any later require/update. That deletes node_modules
    # under the running vite, which from then on serves broken module resolution
    # ("Cannot find module .../vite/dist/node/chunks/dist.js"). The watchdog polls
    # the ABSOLUTE path (our cwd is by then a deleted inode), kills vite, re-runs
    # `cd $A` to pick up the NEW directory, reinstalls and restarts it in place.
    #
    # Why in place and not `exit` + `restart:`? On Rancher Desktop/WSL every restart
    # re-stages the bind mount under /mnt/wsl/rancher-desktop/run/docker-mounts, and
    # a restart-looping container gets handed a DEGENERATE staging dir: /var/www/melis
    # then contains only an empty path skeleton, package.json is never found and it
    # loops forever (observed: RestartCount 35, host tree perfectly intact). Staying
    # alive keeps the mount we booted with. `restart: unless-stopped` remains as a
    # crash net only.
    command: >
      sh -c "A=/var/www/${APP_NAME:-melis}/vendor/melisplatform/melis-core/ui-react;
             while :; do
               if [ ! -f $$A/package.json ]; then
                 echo '[vite] melis-core/ui-react not present in the app volume yet — waiting...'; sleep 10; continue;
               fi;
               cd $$A || { sleep 10; continue; };
               if [ ! -f node_modules/.package-lock.json ] || [ ! -f node_modules/vite/package.json ] ||
                  [ package-lock.json -nt node_modules/.package-lock.json ]; then
                 npm ci --no-audit --no-fund || { echo '[vite] npm ci failed — retrying in 15s'; sleep 15; continue; };
                 chown -R 33:33 node_modules;
               fi;
               npm run dev -- --host 0.0.0.0 & V=$$!;
               while kill -0 $$V 2>/dev/null; do
                 sleep 15;
                 if [ ! -f $$A/node_modules/vite/package.json ]; then
                   echo '[vite] melis-core was replaced by Composer — reinstalling deps in place';
                   kill $$V 2>/dev/null; break;
                 fi;
               done;
               wait $$V 2>/dev/null;
             done"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      # node_modules lives INSIDE this volume, on purpose. A separate named volume
      # mounted inside melis-core (a directory Composer deletes and recreates) pins
      # the old inode in this container's mount namespace: the path then resolves to
      # the new directory with no node_modules at all, and only re-creating the
      # container fixes it. With nothing mounted there a Composer wipe just deletes
      # node_modules, and the supervisor above reinstalls. Costs ~300 MB in the app
      # volume, which php/nginx ignore.
      - melis_app:/var/www/${APP_NAME:-melis}
    environment:
      # Vite proxies backend calls to nginx (the php service is FPM-only, no HTTP).
      MELIS_TARGET: http://web
      # Present a port-less Host header to Melis — its domain routing redirect-loops
      # when the Host carries a port (vite.config.ts honours MELIS_PROXY_HOST).
      MELIS_PROXY_HOST: localhost
    # Wait for nginx to be HEALTHY, not merely started: php's entrypoint can replace
    # vendor/melisplatform/melis-core on boot, so starting earlier just burns an
    # `npm ci` on a tree about to be deleted. An optimisation, not the fix — see the
    # command/volumes notes above.
    depends_on:
      web:
        condition: service_healthy
    networks:
      - melis
    restart: unless-stopped
