# Melis Platform — production-style stack: nginx + PHP-FPM + MySQL.
#   1) cp .env.example .env
#   2) docker compose up -d --build
#   3) open http://localhost:8080 and follow the Melis web installer
#
# nginx serves the app and proxies *.php to php-fpm; the Melis skeleton is baked
# into the php image and seeded into a shared named volume on first run.
services:
  php:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_NAME: ${APP_NAME:-melis}
        TZ: ${TZ:-Europe/Paris}
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WITH_REACT: ${WITH_REACT:-1}
        SKELETON_VERSION: ${SKELETON_VERSION-^6.0}
    image: ${MELIS_FPM_IMAGE:-melisplatform/melis-docker-react:fpm-php8.3}
    container_name: ${MELIS_CONTAINER_NAME:-melis}-php
    depends_on:
      db:
        condition: service_healthy
    # The php image owns the baked code: it must start first so the shared volume
    # is seeded from THIS image (not from the empty nginx image).
    volumes:
      - melis_app:/var/www/${APP_NAME:-melis}
      # The stack folder itself, so the setup wizard's module applier can rewrite the
      # MELIS_MODULE= line of THIS .env (see conf/melis-module-applier.sh). Mount the
      # DIRECTORY, never the single .env file: an editor replacing the file's inode
      # silently detaches a single-file bind mount and then blocks startup.
      - ./:/melis-stack
    environment:
      APP_NAME: ${APP_NAME:-melis}
      TZ: ${TZ:-Europe/Paris}
      HOST_PORT: ${HOST_PORT:-8080}
      # Used only by the entrypoint's defensive create-project (app volume empty).
      SKELETON_VERSION: ${SKELETON_VERSION-^6.0}
      # NOTE: host without :port — keep it clean (a "host:port" value breaks flyway/JDBC)
      MYSQL_HOST: ${MELIS_CONTAINER_NAME:-melis}-db
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME:-melis}-db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-melis}
      MYSQL_USER: ${MYSQL_USER:-melis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-melis}
      # React back-office (/melis-react): baked into the image; this only gates the
      # entrypoint's defensive re-enable (e.g. an app volume from the old image).
      WITH_REACT: ${WITH_REACT:-1}
      # Pre-install redirect target (melis-installer). Empty = the module's default,
      # /melis-react/setup; set MELIS_SETUP_ROUTE=/melis/setup for the legacy wizard.
      MELIS_SETUP_ROUTE: ${MELIS_SETUP_ROUTE:-}
      MELIS_PLATFORM: ${MELIS_PLATFORM:-local}
      MELIS_MODULE: ${MELIS_MODULE:-MySite}
      # Setup wizard, "Apache" step (both wizards: melis-installer's
      # InstallerController::apacheSetupChecker() and SetupWizardService::checkApache()).
      # It looks for mod_headers/mod_alias/mod_deflate via apache_get_modules() and,
      # when that function does not exist — i.e. NOT mod_php, which is exactly this
      # stack — falls back to `getenv('mod_xxx') == "On"`. That fallback is the
      # installer's own escape hatch for non-Apache servers, and nginx provides all
      # three natively (add_header, alias/root, gzip), so declare them On here.
      # Without this the step fails on nginx+FPM and the wizard cannot be completed.
      mod_headers: "On"
      mod_alias: "On"
      mod_deflate: "On"
      # Outgoing mail. The php base image ships no MTA, so mail() (the 2FA login
      # code, password resets, …) died with "Unable to send mail: Unknown error".
      # The image now has msmtp-mta providing /usr/sbin/sendmail, and the entrypoint
      # writes /etc/msmtprc from these (conf/mail-setup.sh). Defaults capture every
      # message in the `mail` service (mailpit) — read them at
      # http://localhost:${MAILPIT_PORT:-8025}, nothing leaves your machine.
      # Point these at a real relay to actually send.
      SMTP_HOST: ${SMTP_HOST:-${MELIS_CONTAINER_NAME:-melis}-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-off}
      SMTP_FROM: ${SMTP_FROM:-melis@localhost}
      # Force From: to SMTP_FROM. Defaults to on whenever SMTP_USER is set — an
      # authenticating relay (Gmail) rejects or rewrites any other sender.
      SMTP_FORCE_FROM: ${SMTP_FORCE_FROM:-}
    networks:
      - melis
    restart: unless-stopped

  web:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    container_name: ${MELIS_CONTAINER_NAME:-melis}-web
    depends_on:
      php:
        condition: service_started
    ports:
      - "${HOST_PORT:-8080}:80"
    # Read-only view of the same app volume + the server block
    volumes:
      - melis_app:/var/www/${APP_NAME:-melis}:ro
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # /melis/ and NOT /: `/` is the PUBLIC site and only exists once a site is
      # installed, so a back-office-only install (or a demo site whose module failed
      # to install) answers 500 there and this service is wrongly marked unhealthy —
      # which in turn keeps anything with `depends_on: service_healthy` (vite) from
      # ever starting. /melis/ is served in every state.
      test: ["CMD", "wget", "-qO-", "http://localhost/melis/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - melis
    restart: unless-stopped

  # Local mail catcher — the destination of everything PHP's mail() sends (see the
  # SMTP_* vars on php). Mailpit is an SMTP server (:1025) that accepts every message
  # and NEVER delivers it, plus a web UI (:8025) to read them. That is what makes the
  # email-2FA login usable offline: submit the login form, open the UI, read the code.
  # No host port for SMTP on purpose — only the php container needs to reach it.
  mail:
    image: axllent/mailpit:latest
    container_name: ${MELIS_CONTAINER_NAME:-melis}-mail
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      # Keep the mailbox in the container: a dev catcher has nothing worth persisting.
      MP_DATABASE: ""
    networks:
      - melis
    restart: unless-stopped

  db:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ${MELIS_CONTAINER_NAME:-melis}-db
    # Bound to localhost only — the DB is reachable container-to-container over the
    # melis network; this host mapping is just for a local GUI client, not the LAN.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-melis}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-melis}
      MYSQL_USER: ${MYSQL_USER:-melis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-melis}
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
      # sql_mode WITHOUT ONLY_FULL_GROUP_BY: legacy Melis tools use loose GROUP BY
      # (melis-cms-news' getNewsList() selects non-aggregated columns), which MySQL 8
      # rejects by default — the News tool 500s on a fresh install otherwise. Same
      # value as the sibling ocidev*/marketplacedev6 stacks.
      - "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    volumes:
      - melis_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-melis}", "-p${MYSQL_PASSWORD:-melis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - melis
    restart: always

networks:
  melis:
    name: ${MELIS_CONTAINER_NAME:-melis}-network

volumes:
  melis_app:
    name: ${MELIS_CONTAINER_NAME:-melis}-app
  melis_db_data:
    name: ${MELIS_CONTAINER_NAME:-melis}-db-data
