; Melis Platform — PHP-FPM pool override
[www]
; Pass the container environment (MYSQL_*, MELIS_*) through to the FPM workers so
; getenv() works in PHP — by default php-fpm clears the environment for workers.
clear_env = no

; Surface worker errors in the container logs (docker logs)
catch_workers_output = yes
decorate_workers_output = no

; Lock error DISPLAY off. php.ini is not enough: Melis re-applies its own error
; config at runtime (melis-core Module.php ini_set, with melis-installer's
; app.interface.php winning the merge with display_errors=1), which re-enables
; rendering errors into the response. A PHP notice printed into an installer AJAX
; reply corrupts the JSON the setup wizard parses. php_admin_flag is
; PHP_INI_SYSTEM-locked, so ini_set() cannot override it. Errors still reach
; `docker compose logs` via log_errors + error_log in conf/php.ini.
php_admin_flag[display_errors] = off
