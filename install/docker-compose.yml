# Melis Platform — turnkey local install (the React development stack).
#   1) cp .env.example .env
#   2) mkdir -p melis          # bind-mount source; required on Rancher Desktop/WSL
#   3) docker compose up --build
#   4) open http://localhost:8080 and follow the Melis web installer
#
# Three services start by default: php (Apache + Melis), db (MySQL) and vite (the
# React dev server with HMR on :5173). This is the stack meant for working ON the
# React back-office, so vite is part of it rather than an opt-in override — the
# code it serves is the same ./melis tree you edit on your host.
# Don't want it? `docker compose up -d php db` (or `docker compose stop vite`).
services:
  php:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP_NAME: ${APP_NAME:-melis}
        TZ: ${TZ:-Europe/Paris}
        PHP_VERSION: ${PHP_VERSION:-8.3}
        WITH_XDEBUG: ${WITH_XDEBUG:-0}
        WITH_REACT: ${WITH_REACT:-1}
      # Passes GITHUB_TOKEN to the build's Composer cache pre-warm WITHOUT baking it
      # into a layer. Without it that step runs unauthenticated (60 GitHub API
      # req/hour) and usually can't finish — the build still succeeds, but the first
      # web install then pays the full ~12 min uncached module step.
      secrets:
        - github_token
    container_name: ${MELIS_CONTAINER_NAME:-melis}-php
    # On Linux, let Xdebug reach your IDE on the host (no-op on macOS/Windows):
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:80"
    # The Melis skeleton is created here on first run and kept on the host so
    # you can edit the code. To start clean, delete ./melis and re-run.
    volumes:
      - ./melis:/var/www/${APP_NAME:-melis}
      # Composer cache. Path must match COMPOSER_HOME (/composer, set in the
      # Dockerfile) — the web installer runs Composer as www-data and shares this
      # cache; a cache under /root would be unreadable to it. The entrypoint chowns
      # it to www-data on every boot (a fresh volume mounts in root-owned).
      - composer-cache:/composer/cache
    environment:
      APP_NAME: ${APP_NAME:-melis}
      TZ: ${TZ:-Europe/Paris}
      HOST_PORT: ${HOST_PORT:-8080}
      # NOTE: host without :port — keep it clean (a "host:port" value breaks flyway/JDBC)
      MYSQL_HOST: ${MELIS_CONTAINER_NAME:-melis}-db
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME:-melis}-db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-melis}
      MYSQL_USER: ${MYSQL_USER:-melis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-melis}
      # Lifts Composer off the 60/hour unauthenticated GitHub API limit that
      # otherwise breaks the web installer's module step — and, in this repo, the
      # React enablement step (3 more GitHub vcs repos). See .env.example.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # React back-office (/melis-react): enabled by default, set 0 for legacy-only.
      WITH_REACT: ${WITH_REACT:-1}
      MELIS_PLATFORM: ${MELIS_PLATFORM:-local}
      MELIS_MODULE: ${MELIS_MODULE:-MySite}
    networks:
      - melis
    restart: unless-stopped

  db:
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: ${MELIS_CONTAINER_NAME:-melis}-db
    # Bound to localhost only — the DB is reachable container-to-container over the
    # melis network; this host mapping is just for a local GUI client, not the LAN.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-melis}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-melis}
      MYSQL_USER: ${MYSQL_USER:-melis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-melis}
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_general_ci"
    volumes:
      - melis_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-melis}", "-p${MYSQL_PASSWORD:-melis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - melis
    restart: always

  # React dev server (Vite + HMR) — part of this stack, not an opt-in override.
  # Serves the SPA source from vendor/melisplatform/melis-core/ui-react with hot
  # reload at http://localhost:${VITE_PORT}, proxying /melis, /assets and /Melis*
  # to the php container. NOT what /melis-react uses: that is served by PHP from
  # melis-core's committed production build (`npm run build` regenerates it).
  vite:
    image: node:${NODE_VERSION:-22}-alpine
    container_name: ${MELIS_CONTAINER_NAME:-melis}-vite
    working_dir: /var/www/${APP_NAME:-melis}/vendor/melisplatform/melis-core/ui-react
    # Supervisor loop — NEVER exits, NEVER relies on a container restart.
    #
    # Composer REPLACES vendor/melisplatform/melis-core whenever it touches the
    # package: on first boot (enable-react.sh), during the web installer's own
    # `composer update`, and on any later require/update. That deletes node_modules
    # under the running vite, which from then on serves broken module resolution
    # ("Cannot find module .../vite/dist/node/chunks/dist.js"). The watchdog polls
    # the ABSOLUTE path (our cwd is by then a deleted inode), kills vite, re-runs
    # `cd $A` to pick up the NEW directory, reinstalls and restarts it in place.
    #
    # Why in place and not `exit` + `restart:`? On Rancher Desktop/WSL every restart
    # re-stages the bind mount under /mnt/wsl/rancher-desktop/run/docker-mounts, and
    # a restart-looping container gets handed a DEGENERATE staging dir: /var/www/melis
    # then contains only an empty path skeleton, package.json is never found and it
    # loops forever (observed: RestartCount 35, host tree perfectly intact). Staying
    # alive keeps the mount we booted with. `restart: unless-stopped` remains as a
    # crash net only.
    command: >
      sh -c "A=/var/www/${APP_NAME:-melis}/vendor/melisplatform/melis-core/ui-react;
             while :; do
               if [ ! -f $$A/package.json ]; then
                 echo '[vite] melis-core/ui-react not present yet (first boot installs it) — waiting...'; sleep 10; continue;
               fi;
               cd $$A || { sleep 10; continue; };
               if [ ! -f node_modules/.package-lock.json ] || [ ! -f node_modules/vite/package.json ] ||
                  [ package-lock.json -nt node_modules/.package-lock.json ]; then
                 npm ci --no-audit --no-fund || { echo '[vite] npm ci failed — retrying in 15s'; sleep 15; continue; };
                 chown -R 33:33 node_modules;
               fi;
               npm run dev -- --host 0.0.0.0 & V=$$!;
               while kill -0 $$V 2>/dev/null; do
                 sleep 15;
                 if [ ! -f $$A/node_modules/vite/package.json ]; then
                   echo '[vite] melis-core was replaced by Composer — reinstalling deps in place';
                   kill $$V 2>/dev/null; break;
                 fi;
               done;
               wait $$V 2>/dev/null;
             done"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./melis:/var/www/${APP_NAME:-melis}
      # NO named volume for node_modules — deliberately. Mounting one INSIDE
      # melis-core (a directory Composer deletes and recreates) pins the old inode
      # in this container's mount namespace: the path then resolves to the new
      # directory with no node_modules at all, and only re-creating the container
      # fixes it. Keeping node_modules in the bind mount means there is nothing to
      # orphan — a Composer wipe just deletes it, and the supervisor above reinstalls.
    environment:
      # Vite proxies backend calls (auth, react-api, module assets) to Apache.
      MELIS_TARGET: http://php
      # Present a port-less Host header to Melis — its domain routing redirect-loops
      # when the Host carries a port (vite.config.ts honours MELIS_PROXY_HOST).
      MELIS_PROXY_HOST: localhost
    # Wait for php to be HEALTHY, not merely started: on first boot the entrypoint
    # bootstraps the skeleton and the React enablement replaces
    # vendor/melisplatform/melis-core, and Apache (hence the healthcheck) only comes
    # up afterwards — starting earlier just burns an `npm ci` on a tree that is
    # about to be deleted. This is an optimisation, NOT the fix: the wizard replaces
    # melis-core again long after php is healthy, so correctness comes from the
    # watchdog + the absence of a node_modules volume (see command/volumes above).
    depends_on:
      php:
        condition: service_healthy
    networks:
      - melis
    restart: unless-stopped

# Build-time only (see the php service's build.secrets): never mounted into a
# running container, never written to an image layer.
secrets:
  github_token:
    environment: GITHUB_TOKEN

networks:
  melis:
    name: ${MELIS_CONTAINER_NAME:-melis}-network

volumes:
  melis_db_data:
    name: ${MELIS_CONTAINER_NAME:-melis}-db-data
  composer-cache:
    name: ${MELIS_CONTAINER_NAME:-melis}-composer-cache
