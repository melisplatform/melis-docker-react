services:
  php:
    container_name: ${MELIS_CONTAINER_NAME}-php
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - APP_NAME=${APP_NAME}
        - TZ=${TZ}
        - PHP_VERSION=${PHP_VERSION:-8.3}
        - MELIS_PLATFORM=${MELIS_PLATFORM}
        - MELIS_MODULE=${MELIS_MODULE}
        - WITH_REACT=${WITH_REACT:-1}
        - SKELETON_VERSION=${SKELETON_VERSION-^6.0}
        # Remap www-data to your host uid/gid so your bind-mounted project stays
        # editable (the entrypoint chowns it to www-data for the web installer).
        # Set HOST_UID=33 in .env to keep the classic www-data ownership.
        - HOST_UID=${HOST_UID:-1000}
        - HOST_GID=${HOST_GID:-1000}
      x-bake:
        cache-from: ["type=local,src=/tmp/.buildx-cache"]
        cache-to: ["type=local,dest=/tmp/.buildx-cache"]
    ports:
      - ${HOST_PORT:-8080}:80
    volumes:
      - ../../../:/var/www/${APP_NAME}
      # Composer cache. The path must match COMPOSER_HOME (/composer, set in the
      # Dockerfile) — the web installer runs Composer as www-data and shares this
      # cache; a cache under /root would be unreadable to it. The entrypoint chowns
      # it to www-data on every boot (a fresh volume mounts in root-owned).
      - composer-cache:/composer/cache
    environment:
      # Host without ":port" — a "host:port" value breaks Melis' flyway/JDBC URL.
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME}-db
      MELIS_PLATFORM: ${MELIS_PLATFORM}
      MELIS_MODULE: ${MELIS_MODULE}
      MYSQL_HOST: ${MELIS_CONTAINER_NAME}-db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_PORT: ${HOST_PORT:-8080}
      # React back-office (/melis-react), on by default like every other stack.
      # ⚠ HERE the app dir is your own pre-existing project (bind-mounted from
      # ../../../), so the first boot rewrites its composer.json / composer.lock /
      # config/application.config.php ON THE HOST. Commit first, or set WITH_REACT=0.
      WITH_REACT: ${WITH_REACT:-1}
      # Pre-install redirect target (melis-installer). Empty = the module's default,
      # /melis-react/setup; set MELIS_SETUP_ROUTE=/melis/setup for the legacy wizard.
      MELIS_SETUP_ROUTE: ${MELIS_SETUP_ROUTE:-}
      # Set 0 to disable entrypoint.sh's bind-mount sanity check (step 0).
      MELIS_MOUNT_CHECK: ${MELIS_MOUNT_CHECK:-1}
    networks:
      - melis
    # NOT `unless-stopped`, deliberately — this service host-binds your project via
    # ../../../. On Rancher Desktop/WSL that bind is staged at container-CREATE time
    # and does not survive a WSL/Rancher restart; a restart policy has dockerd bring
    # the container back on its own, bypassing the staging helper, so it returns
    # attached to an EMPTY directory while looking perfectly healthy. Staying down
    # until `make up` re-creates it makes the failure visible. (db keeps its policy:
    # it uses a named volume and is immune.)
    restart: "no"

  # React dev server (Vite + HMR) — part of this stack, like in install/.
  # Serves the SPA source from vendor/melisplatform/melis-core/ui-react with hot
  # reload at http://localhost:${VITE_PORT}, proxying /melis, /assets and /Melis*
  # to the php container. Because this stack's code is on the host, that source is
  # the same tree you edit in your IDE.
  #
  # NOT what /melis-react uses: that is served by PHP from melis-core's committed
  # production build (`npm run build` regenerates it).
  #
  # Requires WITH_REACT=1 (the default) — with 0, melis-core is the stable release,
  # which ships no ui-react/ source and this service just waits. Don't want it at
  # all? `docker compose up -d php db` (or `docker compose stop vite`).
  vite:
    image: node:${NODE_VERSION:-22}-alpine
    container_name: ${MELIS_CONTAINER_NAME}-vite
    working_dir: /var/www/${APP_NAME}/vendor/melisplatform/melis-core/ui-react
    # Supervisor loop — NEVER exits, NEVER relies on a container restart.
    #
    # Composer REPLACES vendor/melisplatform/melis-core whenever it touches the
    # package: on first boot (enable-react.sh), during the web installer's own
    # `composer update`, and on any later require/update. That deletes node_modules
    # under the running vite, which from then on serves broken module resolution
    # ("Cannot find module .../vite/dist/node/chunks/dist.js"). The watchdog polls
    # the ABSOLUTE path (our cwd is by then a deleted inode), kills vite, re-runs
    # `cd $A` to pick up the NEW directory, reinstalls and restarts it in place.
    #
    # Why in place and not `exit` + `restart:`? On Rancher Desktop/WSL every restart
    # re-stages the bind mount under /mnt/wsl/rancher-desktop/run/docker-mounts, and
    # a restart-looping container gets handed a DEGENERATE staging dir: the app dir
    # then contains only an empty path skeleton, package.json is never found and it
    # loops forever (observed: RestartCount 35, host tree perfectly intact). Staying
    # alive keeps the mount we booted with — which is also why this service runs with
    # `restart: "no"` (see below): a restart never re-stages the bind, it only loses
    # it. (prebuilt/ and fpm/ keep their policy: their vite mounts a NAMED volume.)
    command: >
      sh -c "A=/var/www/${APP_NAME}/vendor/melisplatform/melis-core/ui-react;
             while :; do
               if [ ! -f /var/www/${APP_NAME}/composer.json ]; then
                 echo '[vite] FATAL: your project is not visible here — /var/www/${APP_NAME} has no';
                 echo '[vite] composer.json. On Rancher Desktop/WSL php and vite are staged';
                 echo '[vite] INDEPENDENTLY, so this can happen to vite alone after a restart.';
                 echo '[vite] Fix: cd app/latest && docker compose down && docker compose up -d';
                 sleep 60; continue;
               fi;
               if [ ! -f $$A/package.json ]; then
                 echo '[vite] melis-core/ui-react not present yet (is WITH_REACT=1?) — waiting...'; sleep 10; continue;
               fi;
               cd $$A || { sleep 10; continue; };
               if [ ! -f node_modules/.package-lock.json ] || [ ! -f node_modules/vite/package.json ] ||
                  [ package-lock.json -nt node_modules/.package-lock.json ]; then
                 npm ci --no-audit --no-fund || { echo '[vite] npm ci failed — retrying in 15s'; sleep 15; continue; };
                 chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} node_modules;
               fi;
               npm run dev -- --host 0.0.0.0 & V=$$!;
               while kill -0 $$V 2>/dev/null; do
                 sleep 15;
                 if [ ! -f $$A/node_modules/vite/package.json ]; then
                   echo '[vite] melis-core was replaced by Composer — reinstalling deps in place';
                   kill $$V 2>/dev/null; break;
                 fi;
               done;
               wait $$V 2>/dev/null;
             done"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      # Same host bind mount as php — this stack's code lives on your machine.
      - ../../../:/var/www/${APP_NAME}
      # NO named volume for node_modules — deliberately. Mounting one INSIDE
      # melis-core (a directory Composer deletes and recreates) pins the old inode
      # in this container's mount namespace: the path then resolves to the new
      # directory with no node_modules at all, and only re-creating the container
      # fixes it. Keeping node_modules in the bind mount means there is nothing to
      # orphan — a Composer wipe just deletes it, and the supervisor above reinstalls.
      # (It lands in YOUR project tree, under vendor/, which is git-ignored.)
    environment:
      # Vite proxies backend calls (auth, react-api, module assets) to Apache.
      MELIS_TARGET: http://php
      # Present a port-less Host header to Melis — its domain routing redirect-loops
      # when the Host carries a port (vite.config.ts honours MELIS_PROXY_HOST).
      MELIS_PROXY_HOST: localhost
    # Wait for php to be HEALTHY, not merely started: the entrypoint's React
    # enablement replaces vendor/melisplatform/melis-core before Apache comes up, so
    # starting earlier just burns an `npm ci` on a tree about to be deleted. An
    # optimisation, not the fix — see the command/volumes notes above.
    depends_on:
      php:
        condition: service_healthy
    networks:
      - melis
    # See the php service: a restart policy on a service that host-binds the app dir
    # hands the container back an empty staging dir after a WSL/Rancher restart. The
    # supervisor loop above is the crash net instead — it never exits.
    restart: "no"

  db:
    image: mysql:${MYSQL_VERSION}
    container_name: ${MELIS_CONTAINER_NAME}-db
    env_file: ./.env
    volumes:
      - melis_mysql_data:/var/lib/mysql
    restart: always
    ports:
      # Bound to localhost only (DB not exposed on the LAN). Overridable like every
      # other stack — change DB_HOST_PORT in .env to run this alongside one of them.
      # host:container. The container side is always 3306 (where MySQL listens);
      # only the host side is yours to choose. Same form as the other three stacks.
      - "127.0.0.1:${DB_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME}-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      # NB: --default-authentication-plugin was removed in MySQL 8.4; rely on the
      # server default (caching_sha2_password), which PHP 8.x connects to natively.
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci",
        # sql_mode WITHOUT ONLY_FULL_GROUP_BY: legacy Melis tools use loose GROUP BY
        # (melis-cms-news' getNewsList() selects non-aggregated columns), which MySQL 8
        # rejects by default — the News tool 500s otherwise. Same value as the sibling
        # ocidev*/marketplacedev6 stacks.
        "--sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melis

networks:
  melis:
    name: ${MELIS_CONTAINER_NAME}-network
    driver: bridge

volumes:
  melis_mysql_data:
    name: ${MELIS_CONTAINER_NAME}-mysql-data
  composer-cache:
    name: ${MELIS_CONTAINER_NAME}-composer-cache