services:
  php:
    container_name: ${MELIS_CONTAINER_NAME}-php
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - APP_NAME=${APP_NAME}
        - TZ=${TZ}
        - PHP_VERSION=${PHP_VERSION:-8.3}
        - MELIS_PLATFORM=${MELIS_PLATFORM}
        - MELIS_MODULE=${MELIS_MODULE}
      x-bake:
        cache-from: ["type=local,src=/tmp/.buildx-cache"]
        cache-to: ["type=local,dest=/tmp/.buildx-cache"]
    ports:
      - ${HOST_PORT:-8080}:80
    volumes:
      - ../../../:/var/www/${APP_NAME}
      # Composer cache. The path must match COMPOSER_HOME (/composer, set in the
      # Dockerfile) — the web installer runs Composer as www-data and shares this
      # cache; a cache under /root would be unreadable to it. The entrypoint chowns
      # it to www-data on every boot (a fresh volume mounts in root-owned).
      - composer-cache:/composer/cache
    environment:
      # Host without ":port" — a "host:port" value breaks Melis' flyway/JDBC URL.
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME}-db
      MELIS_PLATFORM: ${MELIS_PLATFORM}
      MELIS_MODULE: ${MELIS_MODULE}
      MYSQL_HOST: ${MELIS_CONTAINER_NAME}-db
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_PORT: ${HOST_PORT:-8080}
      # React back-office (/melis-react), on by default like every other stack.
      # ⚠ HERE the app dir is your own pre-existing project (bind-mounted from
      # ../../../), so the first boot rewrites its composer.json / composer.lock /
      # config/application.config.php ON THE HOST. Commit first, or set WITH_REACT=0.
      WITH_REACT: ${WITH_REACT:-1}
      # Lifts Composer off the 60/hour unauthenticated GitHub API limit that
      # otherwise breaks the web installer's module step — and the React enablement
      # (3 more GitHub vcs repos). See .env.example.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    networks:
      - melis
    restart: unless-stopped

  db:
    image: mysql:${MYSQL_VERSION}
    container_name: ${MELIS_CONTAINER_NAME}-db
    env_file: ./.env
    volumes:
      - melis_mysql_data:/var/lib/mysql
    restart: always
    ports:
      # Bound to localhost only (DB not exposed on the LAN). Overridable like every
      # other stack — change DB_HOST_PORT in .env to run this alongside one of them.
      # host:container. The container side is always 3306 (where MySQL listens);
      # only the host side is yours to choose. Same form as the other three stacks.
      - "127.0.0.1:${DB_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_HOSTNAME: ${MELIS_CONTAINER_NAME}-db
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      # NB: --default-authentication-plugin was removed in MySQL 8.4; rely on the
      # server default (caching_sha2_password), which PHP 8.x connects to natively.
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_general_ci"
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - melis

networks:
  melis:
    name: ${MELIS_CONTAINER_NAME}-network
    driver: bridge

volumes:
  melis_mysql_data:
    name: ${MELIS_CONTAINER_NAME}-mysql-data
  composer-cache:
    name: ${MELIS_CONTAINER_NAME}-composer-cache