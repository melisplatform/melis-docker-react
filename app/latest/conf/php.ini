; Melis Platform — sane PHP defaults for install & back-office
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
upload_max_filesize = 10M
post_max_size = 10M
date.timezone = "Europe/Paris"
expose_php = Off

; Don't render PHP errors into HTTP output — log them instead. Several web-installer
; steps are $.get(..., 'json'): a leading "<br /><b>Warning</b>…" breaks the parse and
; kills the step. Errors are still captured via `docker compose logs`.
display_errors = Off
log_errors = On
; Send them to the container's stderr, or they go nowhere: without this, a fatal
; (e.g. a module activated by the installer but missing from vendor/) is a blank
; 500 with no trace in `docker compose logs`.
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

; Web-installer guard: logs the installer's Composer output (which the wizard
; discards) and repairs a module list that references modules Composer failed to
; install — that mismatch is a hard bootstrap fatal that takes down every URL,
; the installer included. CLI is exempt. See conf/melis-installer-guard.php.
auto_prepend_file = /melis-conf/melis-installer-guard.php

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
