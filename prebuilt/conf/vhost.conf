# Global ServerName (suppresses Apache's AH00558 startup warning)
ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/melis/public

    <Directory /var/www/melis/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>


    # Lock error DISPLAY off. php.ini is not enough: Melis re-applies its own error
    # config at runtime (melis-core Module.php ini_set, with melis-installer's
    # app.interface.php winning the merge with display_errors=1), which re-enables
    # rendering errors into the response. A PHP notice printed into an installer
    # AJAX reply corrupts the JSON the setup wizard parses. php_admin_flag is
    # PHP_INI_SYSTEM-locked, so ini_set() cannot override it. Errors still reach
    # `docker compose logs` via log_errors + error_log in conf/php.ini.
    php_admin_flag display_errors Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
